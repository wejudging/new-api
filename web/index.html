<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>HOHAI</title>
    <meta name="title" content="HOHAI" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#fff" />
    <!--
      Branding that cannot come from the script below: Safari never paints an
      SVG favicon and reads the "add to dock / home screen" artwork from the
      markup instead of from the DOM, so the raster links have to be static.
    -->
    <link id="app-icon" rel="icon" href="/logo.png" />
    <link rel="shortcut icon" href="/logo.png" />
    <link
      id="app-touch-icon"
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Apply the cached branding before the document starts painting so a
      // refresh never flashes the bundled default title or logo while
      // /api/status is still in flight.
      ;(function () {
        var title = 'HOHAI'
        var logo = '/logo.svg'
        try {
          var cached = window.localStorage.getItem('status')
          if (cached) {
            var status = JSON.parse(cached)
            if (status && status.system_name) title = status.system_name
            if (status && status.logo) logo = status.logo
          }
        } catch (error) {
          /* keep the bundled defaults when the cache is missing or malformed */
        }
        document.title = title
        var icon = document.getElementById('app-icon')
        if (!icon) {
          icon = document.createElement('link')
          icon.rel = 'icon'
          document.head.appendChild(icon)
        }
        icon.href = logo

        // iOS and macOS only accept raster artwork for the home screen icon,
        // so a custom SVG logo keeps falling back to the bundled PNG.
        var touchIcon = document.getElementById('app-touch-icon')
        if (touchIcon && /\.(png|jpe?g|webp)($|\?)/i.test(logo)) {
          touchIcon.href = logo
        }
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
